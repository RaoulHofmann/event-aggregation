# fly.toml app configuration file generated for event-aggregator on 2025-01-28T21:48:14+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'event-aggregator'
primary_region = 'syd'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.5'

[env]
  APP_ENV = 'production'
  PUBLIC_SITE_URL = 'https://eventjunction.app'
  GOOGLE_TAG_MANAGER_ID = 'GTM-T2VCZSNS'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  SESSION_COOKIE = 'eventjunction_session'
  DB_CONNECTION = 'pgsql'
  DB_SSLMODE = 'require'
  WORKSPACE_IMAGES_USE_SUPABASE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Add this checks section
  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '30s'
    method = 'get'
    path = '/up'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  release_command = "sh -c 'php /var/www/html/artisan migrate --force && php /var/www/html/artisan teams:migrate && php /var/www/html/artisan eventjunction:bootstrap-admin'"
