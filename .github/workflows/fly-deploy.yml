name: Fly Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventnest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d eventnest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eventnest_test
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate --no-interaction
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: php artisan l5-swagger:generate --no-ansi
      - run: php artisan test --no-ansi
  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate Fly configuration
        run: flyctl config validate --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed application
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 https://event-aggregator.fly.dev/up -o /tmp/eventnest-health.html
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 https://event-aggregator.fly.dev/ -o /tmp/eventnest-home.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/eventnest-home.html').read_text()
          assert all(name in html for name in ['integrations.index', 'api.v1.occurrences', 'designs.homepage', 'docs.api', 'pricing', 'integrations.google.connect', 'integrations.google.callback', 'integrations.google.edit']), 'Updated application routes were not served'
          print('Deployed health and restored-route checks passed.')
          PY
