name: Fly Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventnest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d eventnest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eventnest_test
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate --no-interaction
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: php artisan l5-swagger:generate --no-ansi
      - run: php artisan test --no-ansi
  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate Fly configuration
        run: flyctl config validate --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy to Fly
        shell: bash
        run: |
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          if flyctl deploy --remote-only --ha=false 2>&1 | tee "$log_file"; then
            exit 0
          fi
          python3 - "$log_file" <<'PYLOG'
          import re
          import sys
          from pathlib import Path

          log = Path(sys.argv[1]).read_text(errors='replace')
          text = log.lower()
          stages = {
              'release command': 'release command' in text or 'release_command' in text,
              'migration': 'running migrations' in text,
              'admin ready': 'administrator provisioned' in text or 'administrator already exists' in text,
          }
          hints = {
              'admin credentials missing or invalid': 'set eventjunction_admin_email' in text,
              'admin email already registered': 'bootstrap will not promote' in text,
              'admin provisioning failed': 'administrator provisioning failed' in text,
              'database login rejected': any(p in text for p in ['password authentication failed', 'tenant or user not found']),
              'database connection refused or timed out': any(p in text for p in ['connection refused', 'connection timed out']),
              'database TLS error': any(p in text for p in ['certificate verify failed', 'ssl error', 'ssl is not enabled', 'ssl is required']),
              'remote build error': any(p in text for p in ['failed to build', 'failed to fetch an image', 'failed to solve', 'error building']),
              'machine health failure': any(p in text for p in ['failed to establish a connection to the machine', 'failed to reach healthy state', 'health checks failed']),
          }
          states = sorted(set(re.findall(r'SQLSTATE\[([0-9A-Z]{5})\]', log)))
          messages = [key for key, matched in hints.items() if matched]
          print('::error title=Fly deploy diagnostics::'
                + ', '.join(f'{key}={value}' for key, value in stages.items())
                + ' | SQLSTATE: ' + (', '.join(states) or 'none found')
                + ' | ' + (', '.join(messages) or 'No recognized failure marker. Check Fly deploy job logs.'))
          PYLOG
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Keep one app machine running in Sydney
        shell: bash
        run: |
          flyctl scale count 1 --app event-aggregator --process-group app --region syd --yes
          machine_filter='[.[] | select((.config.metadata.fly_process_group // .config.metadata.process_group) == "app" and .state != "destroyed")]'
          other_regions="$(
            flyctl machine list --app event-aggregator --json |
              jq -r "$machine_filter | map(select(.region != \"syd\") | .region) | unique | join(\",\")"
          )"
          if [[ -n "$other_regions" ]]; then
            flyctl scale count 0 --app event-aggregator --process-group app --region "$other_regions" --yes
          fi
          started_machine=""
          for attempt in {1..10}; do
            machines="$(flyctl machine list --app event-aggregator --json)"
            if jq -e "$machine_filter | length == 1 and .[0].region == \"syd\" and .[0].state == \"started\"" <<<"$machines" >/dev/null; then
              echo 'Verified one started app machine in Sydney.'
              exit 0
            fi
            stopped_machine="$(
              jq -r "$machine_filter | .[] | select(.region == \"syd\" and (.state == \"stopped\" or .state == \"suspended\")) | .id" <<<"$machines"
            )"
            if [[ -n "$stopped_machine" && "$stopped_machine" != "$started_machine" && "$stopped_machine" != *$'\n'* ]]; then
              flyctl machine start "$stopped_machine" --app event-aggregator
              started_machine="$stopped_machine"
            fi
            sleep 5
          done
          status="$(jq -c '[.[] | {region, state, group: (.config.metadata.fly_process_group // .config.metadata.process_group)}]' <<<"$machines")"
          echo "::error::Expected exactly one started Fly app machine in Sydney. Machine state: $status"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed application
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 https://event-aggregator.fly.dev/up -o /tmp/eventnest-health.html
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 https://event-aggregator.fly.dev/ -o /tmp/eventnest-home.html
          status="$(curl --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 -o /dev/null -w '%{http_code}' https://event-aggregator.fly.dev/admin)"
          test "$status" = 302
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/eventnest-home.html').read_text()
          assert all(name in html for name in ['integrations.index', 'api.v1.occurrences', 'designs.homepage', 'docs.api', 'pricing', 'integrations.google.connect', 'integrations.google.callback', 'integrations.google.edit', 'admin.index', 'account.status', 'EventJunction']), 'Updated application routes were not served'
          print('Deployed health, home, and admin access checks passed.')
          PY
